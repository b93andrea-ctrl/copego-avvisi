# Monitor dell'avviso del giorno su copego.cloud con notifica push via ntfy.
name: Controllo avviso Copego

on:
  schedule:
    # Tre turni al giorno (orari UTC: in Italia +1 in inverno, +2 in estate).
    # Ogni turno resta acceso e controlla ogni 5 minuti per circa 5 ore e 50 minuti,
    # e comunque si ferma alle 20:00 UTC (21:00 inverno, 22:00 estate).
    # Un avvio in ritardo da parte di GitHub sposta solo l'inizio: il turno dura lo stesso.
    - cron: "3 5 * * *"
    - cron: "50 10 * * *"
    - cron: "40 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: controllo-copego
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 356
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Controlla ogni 5 minuti
        env:
          COPEGO_EMAIL: ${{ secrets.COPEGO_EMAIL }}
          COPEGO_PASSWORD: ${{ secrets.COPEGO_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          git config user.name "copego-monitor"
          git config user.email "copego-monitor@users.noreply.github.com"
          inizio=$(date -u +%s)
          fine_giornata=$(date -u -d "today 20:00" +%s)
          fine_turno=$((inizio + 350 * 60))
          fine=$(( fine_giornata < fine_turno ? fine_giornata : fine_turno ))
          echo "Turno fino alle $(date -u -d @$fine +%H:%M) UTC"
          while true; do
            python check_copego.py || echo "Controllo fallito, riprovo al prossimo giro"
            git add state.json
            if ! git diff --cached --quiet; then
              git commit -q -m "Aggiorna stato controllo"
              { git pull -q --rebase && git push -q; } || echo "Salvataggio stato fallito"
            fi
            [ "$(date -u +%s)" -lt "$fine" ] || break
            sleep 300
          done
          echo "Turno terminato"
