# Monitor dell'avviso del giorno su copego.cloud con notifica push via ntfy.
#
# Funziona a catena: ogni turno dura circa 5 ore e 50 minuti e controlla ogni 5 minuti.
# Appena parte, prenota il turno successivo (workflow_dispatch), che resta in coda e
# scatta nell'istante in cui questo finisce. Cosi' il controllo e' continuo, 24 ore su 24,
# senza dipendere dalla pianificazione di GitHub, che su questo repository non parte.
# All'inizio e alla fine di ogni turno si verifica che il successivo sia davvero in coda;
# se non lo e' e non si riesce a prenotarlo, arriva una notifica "monitor fermo".
# Gli orari "schedule" qui sotto restano solo come rete di sicurezza.
name: Controllo avviso Copego

on:
  schedule:
    - cron: "3 5 * * *"
    - cron: "50 10 * * *"
    - cron: "40 16 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: controllo-copego
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 356
    steps:
      - uses: actions/checkout@v4

      - name: Prenota il turno successivo
        run: bash .github/turno_successivo.sh

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Controlla ogni 5 minuti
        env:
          COPEGO_EMAIL: ${{ secrets.COPEGO_EMAIL }}
          COPEGO_PASSWORD: ${{ secrets.COPEGO_PASSWORD }}
        run: |
          git config user.name "copego-monitor"
          git config user.email "copego-monitor@users.noreply.github.com"

          # Un turno prenotato ore prima parte con una copia vecchia del repository:
          # prima di tutto ci si allinea all'ultima versione (stato compreso), altrimenti
          # un avviso gia' notificato dal turno precedente verrebbe notificato di nuovo.
          git fetch -q origin main
          git reset -q --hard origin/main
          echo "Allineato a origin/main: $(git rev-parse --short HEAD)"

          salva_stato() {
            git add state.json
            git diff --cached --quiet && return 0
            cp state.json /tmp/state.json
            git fetch -q origin main
            git reset -q --hard origin/main
            cp /tmp/state.json state.json
            git add state.json
            git commit -q -m "Aggiorna stato controllo"
            git push -q origin HEAD:main && echo "Stato salvato." || echo "Salvataggio stato fallito"
          }

          fine=$(( $(date -u +%s) + 350 * 60 ))
          echo "Turno fino alle $(date -u -d @$fine +%H:%M) UTC"
          while true; do
            python check_copego.py || echo "Controllo fallito, riprovo al prossimo giro"
            salva_stato
            [ "$(date -u +%s)" -lt "$fine" ] || break
            sleep 300
          done
          echo "Turno terminato"

      - name: Verifica che il turno successivo sia in coda
        if: always()
        run: bash .github/turno_successivo.sh
