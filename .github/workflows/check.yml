# Monitor dell'avviso del giorno su copego.cloud con notifica push via ntfy.
#
# Funziona a catena: ogni turno dura circa 5 ore e 50 minuti e controlla ogni 5 minuti.
# Appena parte, prenota il turno successivo (workflow_dispatch), che resta in coda e
# scatta nell'istante in cui questo finisce. Cosi' il controllo e' continuo, 24 ore su 24,
# senza dipendere dalla pianificazione di GitHub, che su questo repository non parte.
# Gli orari "schedule" qui sotto restano solo come rete di sicurezza.
name: Controllo avviso Copego

on:
  schedule:
    - cron: "3 5 * * *"
    - cron: "50 10 * * *"
    - cron: "40 16 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: controllo-copego
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 356
    steps:
      - uses: actions/checkout@v4

      - name: Prenota il turno successivo
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run check.yml --ref main --repo "$GITHUB_REPOSITORY"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Controlla ogni 5 minuti
        env:
          COPEGO_EMAIL: ${{ secrets.COPEGO_EMAIL }}
          COPEGO_PASSWORD: ${{ secrets.COPEGO_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          git config user.name "copego-monitor"
          git config user.email "copego-monitor@users.noreply.github.com"
          fine=$(( $(date -u +%s) + 350 * 60 ))
          echo "Turno fino alle $(date -u -d @$fine +%H:%M) UTC"
          while true; do
            python check_copego.py || echo "Controllo fallito, riprovo al prossimo giro"
            git add state.json
            if ! git diff --cached --quiet; then
              git commit -q -m "Aggiorna stato controllo"
              { git pull -q --rebase && git push -q; } || echo "Salvataggio stato fallito"
            fi
            [ "$(date -u +%s)" -lt "$fine" ] || break
            sleep 300
          done
          echo "Turno terminato"
